<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio personal de Nahuel Marcilli - Web Developer">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://marili-mn.github.io/frontend-portfolio/">
  <meta property="og:title" content="Nahuel Marcilli - Web Developer Portfolio">
  <meta property="og:description" content="Desarrollador Web Fullstack especializado en JavaScript, React y Python. Descubre mis proyectos y habilidades.">
  <meta property="og:image" content="https://marili-mn.github.io/frontend-portfolio/assets/preview-card.jpg">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://marili-mn.github.io/frontend-portfolio/">
  <meta property="twitter:title" content="Nahuel Marcilli - Web Developer Portfolio">
  <meta property="twitter:description" content="Desarrollador Web Fullstack especializado en JavaScript, React y Python.">
  <meta property="twitter:image" content="https://marili-mn.github.io/frontend-portfolio/assets/preview-card.jpg">

  <!-- Mobile Theme Color -->
  <meta name="theme-color" content="#1a1a1a" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#cfd8dc" media="(prefers-color-scheme: light)">

  <title>Portfolio - NM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://kit.fontawesome.com/fa62c117c7.js" crossorigin="anonymous"></script>
  
  <!-- GSAP -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollToPlugin.min.js"></script>
  
  <link rel="stylesheet" href="styles/styles.css">
</head>
<body class="light" id="top">
  
  <!-- Header Component -->
  <app-header></app-header>

  <main>
    <!-- About Section Component -->
    <about-section></about-section>

    <!-- Skills Section Component -->
    <section class="section skills" id="skills" data-animate>
        <skills-section></skills-section>
    </section>

    <!-- Projects Section (Populated by main.js) -->
    <section class="section projects" id="projects" data-animate>
      <h2 class="section__title" data-translate="projects_title">Proyectos</h2>
      <div class="projects__grid"></div>
    </section>

    <!-- Contact Section -->
    <section class="section contact center" id="contact" data-animate>
      <h2 class="section__title" data-translate="contact_title">Contacto</h2>
      <contact-button class-name="btn--outline" data-translate-key="contact_button"></contact-button>
    </section>
  </main>

  <!-- Footer Component -->
  <app-footer></app-footer>

  <!-- Scroll Top Component -->
  <scroll-top-btn></scroll-top-btn>
  
  <!-- Toast Notification -->
  <toast-notification></toast-notification>

  <!-- Secure Contact Form -->
  <contact-form></contact-form>

  <!-- DevSec Console -->
  <devsec-console></devsec-console>

  <script type="module" src="src/main.js"></script>
</body>
</html>
